/* ── RESPONSIVE HOOK ── */
function useDevice(){
  const[w,setW]=useState(window.innerWidth);
  useEffect(()=>{
    const h=()=>setW(window.innerWidth);
    window.addEventListener('resize',h);
    return()=>window.removeEventListener('resize',h);
  },[]);
  return{isMobile:w<768,isTablet:w>=768&&w<1024,w};
}

/* ── CHARTS (pure SVG) ── */
function BarChart({data,color}){
  const max=Math.max(...data.map(d=>d.value));
  const W=360,H=120,PL=6,PB=20,PT=8;
  const cW=W-PL*2,cH=H-PT-PB,bW=(cW/data.length)*.55,gap=cW/data.length;
  return <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
    {data.map((d,i)=>{const bH=Math.max(3,(d.value/max)*cH),x=PL+i*gap+gap*.22,y=PT+cH-bH;return <g key={i}><rect x={x} y={y} width={bW} height={bH} fill={color||C.accent} rx={3} opacity={.85}/><text x={x+bW/2} y={H-4} textAnchor="middle" fill={C.sub} fontSize={9}>{d.label}</text></g>;})}
  </svg>;
}
function LineChart({data,color}){
  const max=Math.max(...data.map(d=>d.value));
  const W=360,H=120,PL=6,PB=20,PT=8;
  const cW=W-PL*2,cH=H-PT-PB;
  const pts=data.map((d,i)=>[PL+i*(cW/(data.length-1)),PT+cH-(d.value/max)*cH]);
  return <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
    <polyline points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke={color||C.primary} strokeWidth={2}/>
    {pts.map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r={3} fill={color||C.primary}/><text x={x} y={H-4} textAnchor="middle" fill={C.sub} fontSize={9}>{data[i].label}</text></g>)}
  </svg>;
}

/* ── SHARED UI ── */
function Dot({color}){return <span style={{width:7,height:7,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>;}
function StatusBadge({status}){const c=STATUS_COLOR[status]||C.sub;return <span style={badge(c)}><Dot color={c}/>{STATUS_LABEL[status]||status}</span>;}
function TypeBadge({type}){const map={regular:[C.sky,"Regular"],new:[C.primary,"New Patient"],amenity:[C.accent,"Amenity"]};const[c,l]=map[type]||[C.sub,type];return <span style={badge(c)}>{l}</span>;}

function Inp({label,...p}){
  return <div><label style={{fontSize:12,color:C.sub,marginBottom:5,display:"block",fontWeight:500}}>{label}</label><input style={inp} {...p}/></div>;
}
function Sel({label,opts,...p}){
  return <div><label style={{fontSize:12,color:C.sub,marginBottom:5,display:"block",fontWeight:500}}>{label}</label><select style={{...inp,cursor:"pointer"}} {...p}>{opts.map(o=>typeof o==="string"?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}</select></div>;
}
function Txta({label,...p}){
  return <div><label style={{fontSize:12,color:C.sub,marginBottom:5,display:"block",fontWeight:500}}>{label}</label><textarea style={{...inp,minHeight:80,resize:"vertical"}} {...p}/></div>;
}

function InfoBox({color,children}){
  return <div style={{background:color+"15",border:`1px solid ${color}30`,borderRadius:10,padding:"11px 14px",marginBottom:14,fontSize:13,color,lineHeight:1.5}}>{children}</div>;
}

/* ── RESPONSIVE TABLE ── */
function Table({heads,rows}){
  return <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:480}}>
      <thead><tr>{heads.map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
      <tbody>{rows}</tbody>
    </table>
  </div>;
}

/* ── MODAL ── */
function Modal({onClose,title,subtitle,children,footer,width=580}){
  const{isMobile}=useDevice();
  const overlay={position:"fixed",inset:0,background:"#00000080",backdropFilter:"blur(4px)",display:"flex",alignItems:isMobile?"flex-end":"center",justifyContent:"center",zIndex:999,padding:isMobile?0:16};
  const box={background:C.surface,border:`1px solid ${C.border}`,borderRadius:isMobile?"20px 20px 0 0":"16px",width:isMobile?"100%":width,maxWidth:"100%",maxHeight:isMobile?"92vh":"88vh",display:"flex",flexDirection:"column",overflow:"hidden",...(isMobile?{animation:"slideUp .25s ease"}:{})};
  return <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={box}>
      <div style={{padding:"18px 20px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:C.display,fontSize:19,fontWeight:400}}>{title}</div>
          {subtitle&&<div style={{fontSize:12,color:C.sub,marginTop:3}}>{subtitle}</div>}
        </div>
        <button style={{...btn("ghost",{padding:"8px 10px",minHeight:36}),fontSize:16}} onClick={onClose}>✕</button>
      </div>
      <div style={{padding:"18px 20px",overflowY:"auto",flex:1,display:"flex",flexDirection:"column",gap:14}}>{children}</div>
      {footer&&<div style={{padding:"14px 20px",borderTop:`1px solid ${C.border}`}}>{footer}</div>}
    </div>
  </div>;
}

/* ── SECTION ── */
function Section({title,children,action}){
  return <div style={{marginBottom:24}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:10,flexWrap:"wrap"}}>
      <h2 style={{fontFamily:C.display,fontSize:20,color:C.text,fontWeight:400}}>{title}</h2>
      {action}
    </div>
    {children}
  </div>;
}

/* ── STAT CARDS GRID ── */
function StatCards({items}){
  return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
    {items.map(({label,value,color})=>(
      <div key={label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",borderLeft:`3px solid ${color}`}}>
        <div style={{fontSize:10,color:C.sub,fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>{label}</div>
        <div style={{fontSize:22,fontWeight:700,color}}>{value}</div>
      </div>
    ))}
  </div>;
}

/* ── ADMIN ── */
function AdminView({patients,transactions,inventory}){

  const ptData=[{label:"Mon",value:12},{label:"Tue",value:9},{label:"Wed",value:18},{label:"Thu",value:14},{label:"Fri",value:16},{label:"Sat",value:7}];
  return <div>
    <Section title="Hospital Overview">
      <StatCards items={[
        {label:"Patients Today",value:patients.length,color:C.primary},
        {label:"Revenue Today",value:`₦${revenue.toLocaleString()}`,color:C.accent},
        {label:"Pending Payments",value:pending,color:C.danger},
        {label:"Low Stock",value:lowStock,color:"#FB923C"},
      ]}/>
    </Section>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:16,marginBottom:20}}>
      <div style={card()}><div style={{fontSize:11,color:C.sub,fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:10}}>Revenue This Week (₦)</div><LineChart data={revData} color={C.primary}/></div>
      <div style={card()}><div style={{fontSize:11,color:C.sub,fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:10}}>Patients Per Day</div><BarChart data={ptData} color={C.accent}/></div>
    </div>
    <Section title="Patient Flow">
      <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8,WebkitOverflowScrolling:"touch"}}>
        {STATUS_FLOW.map((st,i,arr)=>{
          const count=patients.filter(p=>p.status===st).length,color=STATUS_COLOR[st];
          return <React.Fragment key={st}>
            <div style={{background:C.card,border:`1px solid ${color}40`,borderRadius:10,padding:"10px 14px",minWidth:80,textAlign:"center",flexShrink:0}}>

              <div style={{fontSize:10,color:C.sub,marginTop:2,fontWeight:500}}>{STATUS_LABEL[st]}</div>
            </div>
            {i<arr.length-1&&<div style={{color:C.muted,fontSize:16,display:"flex",alignItems:"center",flexShrink:0}}>›</div>}
          </React.Fragment>;
        })}
      </div>
    </Section>
    <Section title="All Patients">
      <div style={card({padding:0,overflow:"hidden"})}>
        <Table heads={["Patient","Type","Status","Wallet"]} rows={patients.map(p=>(
          <tr key={p.id}>
            <td style={TD}><div style={{fontWeight:600}}>{p.name}</div><div style={{fontSize:11,color:C.sub}}>{p.id}</div></td>
            <td style={TD}><TypeBadge type={p.type}/></td>
            <td style={TD}><StatusBadge status={p.status}/></td>
            <td style={TD}><span style={{color:C.accent,fontWeight:600}}>₦{p.wallet.toLocaleString()}</span></td>
          </tr>
        ))}/>
      </div>
    </Section>
  </div>;
}

/* ── RECEPTION ── */
function ReceptionView({patients,onRegister}){
  const[showModal,setShowModal]=useState(false);
  const[rType,setRType]=useState("regular");
  const[step,setStep]=useState(1);
  const blank={name:"",phone:"",appointmentDate:"",homeAddress:"",officeAddress:"",email:"",dob:"",age:"",nokName:"",nokAge:"",nokSex:"Male",nokRel:"",nokPhone:"",nokAddress:"",child1:"",child2:"",child3:"",motherName:"",fatherName:"",genotype:"AA",bloodGroup:"O+"};
  const[f,setF]=useState(blank);
  const u=(k,v)=>setF(p=>({...p,[k]:v}));
  const isNew=rType==="new";
  const maxStep=isNew?3:1;
  const typeColor={regular:C.sky,new:C.primary,amenity:C.accent};
  const dayInfo={regular:"Mon & Thu",new:"Wednesdays",amenity:"Wednesdays"};
  const submit=()=>{onRegister({...f,type:rType});setShowModal(false);setStep(1);setF(blank);};

  return <div>
    <Section title="Reception" action={<button style={btn("primary")} onClick={()=>setShowModal(true)}>+ Register Patient</button>}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
        {["regular","new","amenity"].map(t=>(
          <div key={t} style={{...card({borderLeft:`3px solid ${typeColor[t]}`,cursor:"pointer"})}} onClick={()=>{setRType(t);setShowModal(true);}}>
            <div style={{fontWeight:700,color:typeColor[t],fontSize:13,marginBottom:3}}>{t==="new"?"New Patient":t[0].toUpperCase()+t.slice(1)}</div>
            <div style={{fontSize:11,color:C.sub}}>Days: {dayInfo[t]}</div>
            <div style={{fontSize:24,fontWeight:700,marginTop:8}}>{patients.filter(p=>p.type===t).length}</div>
          </div>
        ))}
      </div>
    </Section>
    <Section title="Today's Queue">
      <div style={card({padding:0,overflow:"hidden"})}>
        <Table heads={["Patient","Type","Status","Paid"]} rows={patients.map(p=>(
          <tr key={p.id}>
            <td style={TD}><div style={{fontWeight:600}}>{p.name}</div><div style={{fontSize:11,color:C.sub}}>{p.id}</div></td>
            <td style={TD}><TypeBadge type={p.type}/></td>
            <td style={TD}><StatusBadge status={p.status}/></td>
            <td style={TD}>{p.paid?<span style={{color:C.primary,fontWeight:600}}>✓</span>:<span style={{color:C.danger}}>⏳</span>}</td>
          </tr>
        ))}/>
      </div>
    </Section>

    {showModal&&<Modal title="Register Patient" subtitle={isNew?`Step ${step} of ${maxStep}`:undefined} onClose={()=>{setShowModal(false);setStep(1);}}
      footer={<div style={{display:"flex",justifyContent:"space-between"}}>
        {step>1?<button style={btn("ghost")} onClick={()=>setStep(p=>p-1)}>← Back</button>:<div/>}
        {(!isNew||step<maxStep)?<button style={btn("primary")} onClick={()=>isNew?setStep(p=>p+1):submit()} disabled={!f.name||!f.phone}>{isNew?"Next →":"Register"}</button>:<button style={btn("primary")} onClick={submit} disabled={!f.name||!f.phone}>✓ Complete</button>}
      </div>}>
      <select style={{...inp}} value={rType} onChange={e=>setRType(e.target.value)}>
        <option value="regular">Regular Patient</option>
        <option value="new">New Patient</option>
        <option value="amenity">Amenity Patient</option>
      </select>

      {isNew&&<div style={{display:"flex",gap:6,alignItems:"center"}}>
        {["Basic","Next of Kin","Medical"].map((lbl,i)=>(
          <React.Fragment key={lbl}>
            <div style={{display:"flex",alignItems:"center",gap:5}}>

              <span style={{fontSize:11,color:step===i+1?C.text:C.sub,fontWeight:step===i+1?600:400}}>{lbl}</span>
            </div>
            {i<2&&<div style={{flex:1,height:1,background:C.border}}/>}
          </React.Fragment>
        ))}
      </div>}

      {(!isNew||step===1)&&<>
        <Inp label="Full Name *" value={f.name} onChange={e=>u("name",e.target.value)} placeholder="Patient's full name"/>
        <Inp label="Phone (WhatsApp) *" value={f.phone} onChange={e=>u("phone",e.target.value)} placeholder="080XXXXXXXX" type="tel"/>
        <Inp label="Appointment Date *" type="date" value={f.appointmentDate} onChange={e=>u("appointmentDate",e.target.value)}/>
        {isNew&&<>
          <Inp label="Home Address *" value={f.homeAddress} onChange={e=>u("homeAddress",e.target.value)}/>

            <td style={TD}><span style={{fontWeight:600}}>{t.patient}</span></td>

/* ── DOCTOR ── */
function DoctorView({patients,onUpdate,onAdvance}){
  const{isMobile}=useDevice();
  const queue=patients.filter(p=>p.status==="doctor");
  const[sel,setSel]=useState(null);
  const[showQueue,setShowQueue]=useState(false);
  const[notes,setNotes]=useState({diagnosis:"",prescription:"",labRequest:""});
  useEffect(()=>{if(sel)setNotes({diagnosis:sel.diagnosis||"",prescription:sel.prescription||"",labRequest:sel.labRequest||""});},[sel?.id]);
  const refer=(dest)=>{onUpdate(sel.id,notes);onAdvance(sel.id,dest);setSel(null);};
  const VChip=({label,value,unit,ok})=>(
    <div style={{background:ok?C.primaryDim:C.dangerDim,border:`1px solid ${ok?C.primary:C.danger}30`,borderRadius:8,padding:"8px 10px",flex:1,minWidth:70}}>
      <div style={{fontSize:9,color:C.sub,fontWeight:600,letterSpacing:.5,textTransform:"uppercase"}}>{label}</div>
      <div style={{fontSize:14,fontWeight:700,color:ok?C.primary:C.danger,marginTop:1}}>{value}<span style={{fontSize:10,color:C.sub,fontWeight:400}}> {unit}</span></div>
    </div>
  );

  const QueuePanel=()=><>
    <div style={{fontSize:12,color:C.sub,fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:10}}>Queue ({queue.length})</div>
    {queue.length===0?<div style={{...card(),color:C.sub,fontSize:13,textAlign:"center",padding:24}}>No patients</div>:
    queue.map(p=>(
      <div key={p.id} style={{...card({cursor:"pointer",marginBottom:8,border:`1px solid ${sel?.id===p.id?C.primary:C.border}`,background:sel?.id===p.id?C.primaryDim:C.card})}} onClick={()=>{setSel(p);setShowQueue(false);}}>
        <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
        <div style={{fontSize:11,color:C.sub,marginTop:2}}>{p.id}</div>
        <div style={{marginTop:6}}><TypeBadge type={p.type}/></div>
      </div>
    ))}
  </>;

  return <div style={{display:"flex",flexDirection:isMobile?"column":"row",gap:16,height:"100%"}}>
    {!isMobile&&<div style={{width:220,flexShrink:0,overflowY:"auto"}}><QueuePanel/></div>}
    {isMobile&&<div style={{display:"flex",gap:10,alignItems:"center",marginBottom:4}}>
      <button style={btn("ghost",{padding:"8px 14px",fontSize:13})} onClick={()=>setShowQueue(true)}>👥 Queue ({queue.length})</button>
      {sel&&<span style={{fontSize:13,color:C.sub}}>Seeing: <b style={{color:C.text}}>{sel.name}</b></span>}
    </div>}
    {isMobile&&showQueue&&<Modal title="Patient Queue" onClose={()=>setShowQueue(false)} width={400}><QueuePanel/></Modal>}

    <div style={{flex:1,overflowY:"auto"}}>
      {!sel?<div style={{...card({textAlign:"center",padding:48}),color:C.sub}}><div style={{fontSize:32,marginBottom:12}}>👨‍⚕️</div><div style={{fontFamily:C.display,fontSize:18}}>Select a patient to begin</div></div>:<>
        <div style={card({marginBottom:14})}>
          <div style={{fontFamily:C.display,fontSize:20,marginBottom:3}}>{sel.name}</div>
          <div style={{fontSize:12,color:C.sub,marginBottom:10}}>{sel.id} · {sel.phone} · DOB: {sel.dob}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            <TypeBadge type={sel.type}/>
            {sel.genotype&&<span style={badge(C.sky)}>Genotype: {sel.genotype}</span>}
            {sel.bloodGroup&&<span style={badge(C.accent)}>Blood: {sel.bloodGroup}</span>}
          </div>
          {sel.vitals?.bp&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <VChip label="BP" value={sel.vitals.bp} unit="mmHg" ok={true}/>
            <VChip label="Temp" value={sel.vitals.temp} unit="°C" ok={parseFloat(sel.vitals.temp)<37.5}/>
            <VChip label="Pulse" value={sel.vitals.pulse} unit="bpm" ok={true}/>
            <VChip label="SpO2" value={sel.vitals.spo2||"—"} unit="%" ok={true}/>
            <VChip label="Weight" value={sel.vitals.weight} unit="kg" ok={true}/>
          </div>}
        </div>
        <div style={card({marginBottom:14,display:"flex",flexDirection:"column",gap:14})}>
          <div style={{fontFamily:C.display,fontSize:18,fontWeight:400}}>Consultation Notes</div>
          <Txta label="Diagnosis / Presenting Complaint" value={notes.diagnosis} onChange={e=>setNotes(v=>({...v,diagnosis:e.target.value}))} placeholder="Primary diagnosis..."/>
          <Txta label="Prescription" value={notes.prescription} onChange={e=>setNotes(v=>({...v,prescription:e.target.value}))} placeholder="Drug – dose – frequency – duration..."/>
          <Txta label="Lab Investigation Request" value={notes.labRequest} onChange={e=>setNotes(v=>({...v,labRequest:e.target.value}))} placeholder="Investigations required..."/>
        </div>
        <div style={card({display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"})}>
          <span style={{fontSize:13,color:C.sub,flex:1}}>Refer to:</span>
          {notes.prescription&&<button style={btn("primary")} onClick={()=>refer("pharmacy")}>→ Pharmacy</button>}
          {notes.labRequest&&<button style={btn("accent")} onClick={()=>refer("lab")}>→ Laboratory</button>}
          {!notes.prescription&&!notes.labRequest&&<button style={btn("primary")} onClick={()=>{onUpdate(sel.id,notes);onAdvance(sel.id,"completed");setSel(null);}}>✓ Complete Visit</button>}
        </div>
      </>}
    </div>
  </div>;
}

          </tr>;
        })}/>

    </Section>

      footer={<button style={btn("primary")} onClick={()=>{alert(`Appointment confirmed!\n${booked.name} at ${booked.slot}\nConfirmation sent to ${f.phone}`);setBooked(null);}}>Confirm Booking</button>}>
      <Inp label="Patient Name" value={f.name} onChange={e=>setF(v=>({...v,name:e.target.value}))}/>
      <Inp label="Phone Number" value={f.phone} onChange={e=>setF(v=>({...v,phone:e.target.value}))} type="tel"/>
      <Inp label="Preferred Date" type="date" value={f.date} onChange={e=>setF(v=>({...v,date:e.target.value}))}/>
      <Txta label="Reason for Consultation" value={f.complaint} onChange={e=>setF(v=>({...v,complaint:e.target.value}))} placeholder="Describe your complaint..."/>
      <InfoBox color={C.primary}>Fee: ₦{booked.fee.toLocaleString()} · Debited from patient wallet</InfoBox>
    </Modal>}
  </div>;
}

/* ── AI ASSISTANT ── */
function AIView(){
  const[apiKey,setApiKey]=useState("");
  const[showKey,setShowKey]=useState(false);
  const[msgs,setMsgs]=useState([{role:"assistant",content:"Hello! I'm YILAI, the AI health intelligence engine for Hope Haven Hospital, Jos.\n\nI can help with:\n• Clinical decision support & differential diagnosis\n• Drug interactions, dosing & contraindications\n• Lab result interpretation\n• Nigerian healthcare protocols (malaria, typhoid, sickle cell)\n• Hospital workflow guidance\n\nPaste your Anthropic API key above to activate, then ask anything."}]);
  const[inp2,setInp2]=useState("");
  const[loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const send=async()=>{
    if(!inp2.trim()||loading)return;
    if(!apiKey.trim()){alert("Please enter your Anthropic API key first.");return;}
    const userMsg={role:"user",content:inp2};
    setMsgs(p=>[...p,userMsg]);setInp2("");setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:"You are YILAI, the AI health intelligence engine for Hope Haven Hospital, Jos, Nigeria. Help healthcare professionals with clinical decision support, drug information, lab interpretation, and hospital operations. Be concise and clinically accurate.",messages:msgs.concat([userMsg]).map(m=>({role:m.role,content:m.content}))})});
      const data=await res.json();
      setMsgs(p=>[...p,{role:"assistant",content:data.content?.[0]?.text||"Error."}]);
    }catch{setMsgs(p=>[...p,{role:"assistant",content:"Connection error. Check API key and network."}]);}
    setLoading(false);
    setTimeout(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),100);
  };
  const suggestions=["Drug interaction: Amlodipine + Metformin","Interpret: Hb 8.5g/dL in adult woman","Uncomplicated malaria treatment (adult)","Differentials: fever + headache, Jos Nigeria"];
  return <div style={{display:"flex",flexDirection:"column",height:"100%",gap:12}}>
    <div style={card({display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",borderLeft:`3px solid ${C.primary}`})}>
      <div style={{width:38,height:38,borderRadius:"50%",background:C.primaryDim,border:`1px solid ${C.primary}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>✨</div>
      <div style={{flex:1,minWidth:120}}>
        <div style={{fontFamily:C.display,fontSize:16,color:C.primary}}>YILAI — Yilnan AI</div>
        <div style={{fontSize:11,color:C.sub}}>Powered by Claude · Always verify clinically</div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <input type={showKey?"text":"password"} style={{...inp,width:200,fontSize:12}} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="Paste API key..."/>
        <button style={btn("ghost",{padding:"8px 12px",fontSize:12,minHeight:36})} onClick={()=>setShowKey(p=>!p)}>{showKey?"Hide":"Show"}</button>
      </div>
    </div>
    <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10}}>
      {msgs.map((m,i)=>(
        <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",alignItems:"flex-start",gap:8}}>
          {m.role==="assistant"&&<div style={{width:26,height:26,borderRadius:"50%",background:C.primaryDim,border:`1px solid ${C.primary}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0,marginTop:2}}>✨</div>}
          <div style={{maxWidth:"80%",background:m.role==="user"?C.primaryDim:C.card,border:`1px solid ${m.role==="user"?C.primary+"40":C.border}`,borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px",padding:"10px 14px",fontSize:13,lineHeight:1.6,color:C.text,whiteSpace:"pre-wrap"}}>{m.content}</div>
        </div>
      ))}
      {loading&&<div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{width:26,height:26,borderRadius:"50%",background:C.primaryDim,border:`1px solid ${C.primary}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>✨</div>
        <div style={card({padding:"10px 14px",display:"flex",gap:5,alignItems:"center"})}>
          {[0,1,2].map(j=><div key={j} style={{width:6,height:6,borderRadius:"50%",background:C.primary,opacity:.5,animation:`pulse-dot 1.2s ease-in-out ${j*.2}s infinite alternate`}}/>)}
        </div>
      </div>}
      <div ref={endRef}/>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {suggestions.map(sg=><button key={sg} style={{...badge(C.sky),cursor:"pointer",padding:"6px 10px",fontSize:11}} onClick={()=>setInp2(sg)}>{sg}</button>)}
    </div>
    <div style={{display:"flex",gap:8}}>
      <input style={{...inp,flex:1}} value={inp2} onChange={e=>setInp2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="Ask YILAI anything..."/>
      <button style={btn("primary",{padding:"10px 18px",flexShrink:0})} onClick={send} disabled={loading}>{loading?"…":"Send"}</button>
    </div>
  </div>;
}

/* ══════════════════════════════════════
   MAIN APP
══════════════════════════════════════ */
function YilnanApp(){
  const{isMobile}=useDevice();
  const[role,setRole]=useState("admin");
  const[patients,setPatients]=useState(INIT_PATIENTS);
  const[inventory,setInventory]=useState(INIT_INVENTORY);
  const[transactions,setTx]=useState(INIT_TX);
  const[notifs,setNotifs]=useState([
    {id:1,msg:"Fatima Abdullahi cleared accounts. Ready for vitals.",target:"nursing",read:false,time:"09:15"},
    {id:2,msg:"Low stock: Normal Saline 500ml (12 bags remaining).",target:"pharmacy",read:false,time:"08:30"},
    {id:3,msg:"Emmanuel Danjuma awaiting ₦1,000 payment.",target:"accounts",read:false,time:"09:00"},
  ]);
  const[showNotifs,setShowNotifs]=useState(false);
  const[showMoreMenu,setShowMoreMenu]=useState(false);
  const unread=notifs.filter(n=>!n.read).length;

  const addNotif=(msg,target)=>setNotifs(p=>[{id:Date.now(),msg,target,read:false,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})},...p]);
  const handleAdvance=(pid,ns)=>{
    setPatients(p=>p.map(pt=>pt.id===pid?{...pt,status:ns}:pt));
    const map={nursing:["Patient cleared. Ready for vitals.","nursing"],doctor:["Vitals done. File forwarded to doctor.","doctor"],pharmacy:["Prescription received.","pharmacy"],lab:["Lab request received. Patient must pay first.","lab"],completed:["Visit completed.","admin"]};
    if(map[ns])addNotif(...map[ns]);
  };
  const handlePayment=(pid,amount,type)=>{
    if(amount>0)setPatients(p=>p.map(pt=>pt.id===pid?{...pt,wallet:pt.wallet-amount,paid:true}:pt));
    else setPatients(p=>p.map(pt=>pt.id===pid?{...pt,paid:true}:pt));
    const pt=patients.find(p=>p.id===pid);
    if(amount>0)setTx(p=>[{id:`TXN-${String(p.length+1).padStart(3,"0")}`,patient:pt?.name||"",pid,type,amount,date:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),status:"paid"},...p]);
  };
  const handleTopup=(pid,amount)=>{
    setPatients(p=>p.map(pt=>pt.id===pid?{...pt,wallet:pt.wallet+amount}:pt));
    const pt=patients.find(p=>p.id===pid);
    setTx(p=>[{id:`TXN-${String(p.length+1).padStart(3,"0")}`,patient:pt?.name||"",pid,type:"Wallet Top-up",amount,date:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),status:"paid"},...p]);
    addNotif(`₦${amount.toLocaleString()} credited to ${pt?.name}.`,"accounts");
  };
  const handleRegister=(form)=>{
    const id=`HH-${String(896+patients.length).padStart(4,"0")}`;
    setPatients(p=>[...p,{id,name:form.name,type:form.type,status:"accounts",phone:form.phone,appointmentDate:form.appointmentDate,wallet:0,vitals:{},email:form.email||"",dob:form.dob||"",genotype:form.genotype||"AA",bloodGroup:form.bloodGroup||"O+",nokName:form.nokName||"",diagnosis:"",prescription:"",labRequest:"",paid:false}]);
    addNotif(`${form.name} registered (${form.type}). Awaiting ₦1,000 payment.`,"accounts");
  };
  const handleVitals=(pid,v)=>setPatients(p=>p.map(pt=>pt.id===pid?{...pt,vitals:v}:pt));
  const handleDoctorUpdate=(pid,notes)=>setPatients(p=>p.map(pt=>pt.id===pid?{...pt,...notes}:pt));
  const handleInventoryUpdate=(item)=>setInventory(p=>[...p,{...item,id:p.length+1,stock:Number(item.stock),reorder:Number(item.reorder),price:Number(item.price)}]);

  const badgeCounts={accounts:patients.filter(p=>!p.paid).length,nursing:patients.filter(p=>p.status==="nursing").length,doctor:patients.filter(p=>p.status==="doctor").length,pharmacy:patients.filter(p=>p.status==="pharmacy").length,lab:patients.filter(p=>p.status==="lab").length};
  const badgeColors={accounts:C.danger,nursing:C.sky,doctor:C.primary,pharmacy:C.purple,lab:"#FB923C"};

  /* Mobile bottom nav — 5 primary tabs */
  const primaryNav=[
    {id:"admin",label:"Overview",icon:"🏥"},
    {id:"reception",label:"Register",icon:"📋"},
    {id:"accounts",label:"Accounts",icon:"💳"},
    {id:"doctor",label:"Doctor",icon:"👨‍⚕️"},
    {id:"__more",label:"More",icon:"⋯"},
  ];
  /* Desktop sidebar nav — all tabs */
  const allNav=[
    {id:"admin",label:"Overview",icon:"🏥"},
    {id:"reception",label:"Reception",icon:"📋"},
    {id:"accounts",label:"Accounts",icon:"💳"},
    {id:"nursing",label:"Nursing",icon:"🩺"},
    {id:"doctor",label:"Doctor",icon:"👨‍⚕️"},
    {id:"pharmacy",label:"Pharmacy",icon:"💊"},
    {id:"lab",label:"Laboratory",icon:"🔬"},
    {id:"telehealth",label:"Telehealth",icon:"💻"},
    {id:"ai",label:"YILAI AI",icon:"✨"},
  ];
  const moreItems=[
    {id:"nursing",label:"Nursing",icon:"🩺"},
    {id:"pharmacy",label:"Pharmacy",icon:"💊"},
    {id:"lab",label:"Laboratory",icon:"🔬"},
    {id:"telehealth",label:"Telehealth",icon:"💻"},
    {id:"ai",label:"YILAI AI",icon:"✨"},
  ];

  const titles={admin:"Overview",reception:"Reception",accounts:"Accounts",nursing:"Nursing",doctor:"Doctor",pharmacy:"Pharmacy",lab:"Laboratory",telehealth:"Telehealth",ai:"YILAI AI"};

  const renderContent=()=>{
    const p={patients,transactions,inventory,onPayment:handlePayment,onTopup:handleTopup,onAdvance:handleAdvance,onRegister:handleRegister,onVitals:handleVitals,onUpdate:handleDoctorUpdate,onInventoryUpdate:handleInventoryUpdate};
    switch(role){
      case"admin":return<AdminView {...p}/>;
      case"reception":return<ReceptionView {...p}/>;
      case"accounts":return<AccountsView {...p}/>;
      case"nursing":return<NursingView {...p}/>;
      case"doctor":return<DoctorView {...p}/>;
      case"pharmacy":return<PharmacyView {...p}/>;
      case"lab":return<LabView {...p}/>;
      case"telehealth":return<TelehealthView/>;
      case"ai":return<AIView/>;
    }
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:C.bg,fontFamily:C.font,color:C.text,overflow:"hidden"}}>

      {/* HEADER */}
      <div style={{height:54,background:C.surface,borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {isMobile&&<span style={{fontFamily:C.display,fontSize:22,color:C.primary}}>Yilnan</span>}
          {!isMobile&&<span style={{fontFamily:C.display,fontSize:22,color:C.primary}}>Yilnan</span>}
          {!isMobile&&<span style={{fontSize:11,color:C.muted}}>Hope Haven Hospital · Jos</span>}
          {isMobile&&<span style={{fontSize:13,color:C.sub,fontWeight:600}}>{titles[role]}</span>}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",position:"relative"}}>
          <button style={{...btn("ghost",{padding:"7px 9px",minHeight:38,position:"relative"}),fontSize:16}} onClick={()=>setShowNotifs(v=>!v)}>
            🔔
            {unread>0&&<span style={{position:"absolute",top:-2,right:-2,width:16,height:16,background:C.danger,borderRadius:"50%",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}>{unread}</span>}
          </button>
          {showNotifs&&(
            <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",width:Math.min(300,window.innerWidth-20),background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,zIndex:200,overflow:"hidden",boxShadow:"0 8px 30px #00000060"}}>
              <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:600,fontSize:13}}>Notifications</span>
                <button style={{fontSize:11,color:C.primary,cursor:"pointer",background:"none",border:"none"}} onClick={()=>setNotifs(p=>p.map(n=>({...n,read:true})))}>Mark all read</button>
              </div>
              <div style={{maxHeight:260,overflowY:"auto"}}>
                {notifs.map(n=>(
                  <div key={n.id} style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}20`,background:n.read?"transparent":C.primaryDim,cursor:"pointer"}} onClick={()=>setNotifs(p=>p.map(x=>x.id===n.id?{...x,read:true}:x))}>
                    <div style={{fontSize:12,color:n.read?C.sub:C.text,lineHeight:1.4}}>{n.msg}</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:2}}>{n.time}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{width:30,height:30,borderRadius:"50%",background:C.primaryDim,border:`1px solid ${C.primary}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:C.primary}}>A</div>
        </div>
      </div>

      {/* BODY */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* DESKTOP SIDEBAR */}
        {!isMobile&&(
          <div style={{width:210,flexShrink:0,background:C.surface,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",padding:"12px 10px",overflowY:"auto"}}>
            {allNav.map(item=>{
              const count=badgeCounts[item.id]||0;
              const active=role===item.id;
              return <div key={item.id}
                style={{display:"flex",alignItems:"center",gap:9,padding:"9px 10px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:active?600:400,color:active?C.primary:C.sub,background:active?C.primaryDim:"transparent",border:`1px solid ${active?C.primary+"30":"transparent"}`,transition:"all .15s",marginBottom:2}}
                onClick={()=>setRole(item.id)}>
                <span style={{fontSize:15}}>{item.icon}</span>
                <span style={{flex:1}}>{item.label}</span>
                {count>0&&<span style={{...badge(badgeColors[item.id]||C.sub),padding:"1px 7px",fontSize:10}}>{count}</span>}
              </div>;
            })}
            <div style={{marginTop:"auto",paddingTop:12,borderTop:`1px solid ${C.border}`,fontSize:10,color:C.muted,textAlign:"center"}}>Yilnan v1.0 · © 2025</div>
          </div>
        )}

        {/* MAIN CONTENT */}
        <div style={{flex:1,overflowY:role==="doctor"||role==="ai"?"hidden":"auto",padding:isMobile?"14px 12px":"20px 24px",display:role==="doctor"||role==="ai"?"flex":"block",flexDirection:"column"}}>
          {renderContent()}
          {isMobile&&<div style={{height:70}}/>}{/* spacer for bottom nav */}
        </div>
      </div>

      {/* MOBILE BOTTOM NAV */}
      {isMobile&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,height:62,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100}}>
          {primaryNav.map(item=>{
            const isMore=item.id==="__more";
            const active=!isMore&&role===item.id;
            const count=badgeCounts[item.id]||0;
            return <button key={item.id}
              style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",cursor:"pointer",color:active?C.primary:C.sub,position:"relative",padding:"6px 0"}}
              onClick={()=>isMore?setShowMoreMenu(true):setRole(item.id)}>
              <span style={{fontSize:19}}>{item.icon}</span>
              <span style={{fontSize:10,fontWeight:active?600:400}}>{item.label}</span>
              {count>0&&<span style={{position:"absolute",top:4,right:"50%",marginRight:-16,width:16,height:16,background:badgeColors[item.id]||C.danger,borderRadius:"50%",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}>{count}</span>}
              {active&&<div style={{position:"absolute",bottom:0,left:"25%",right:"25%",height:2,background:C.primary,borderRadius:"2px 2px 0 0"}}/>}
            </button>;
          })}
        </div>
      )}

      {/* MOBILE MORE MENU */}
      {isMobile&&showMoreMenu&&(
        <div style={{position:"fixed",inset:0,background:"#00000060",zIndex:200}} onClick={()=>setShowMoreMenu(false)}>
          <div style={{position:"absolute",bottom:0,left:0,right:0,background:C.surface,borderRadius:"20px 20px 0 0",padding:"20px 16px 40px",animation:"slideUp .25s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{width:36,height:4,background:C.muted,borderRadius:2,margin:"0 auto 20px"}}/>
            <div style={{fontFamily:C.display,fontSize:18,marginBottom:16,color:C.text}}>More</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {moreItems.map(item=>{
                const count=badgeCounts[item.id]||0;
                return <button key={item.id}
                  style={{...card({cursor:"pointer",display:"flex",alignItems:"center",gap:10,padding:"14px 16px",border:`1px solid ${role===item.id?C.primary:C.border}`}),background:role===item.id?C.primaryDim:C.card}}
                  onClick={()=>{setRole(item.id);setShowMoreMenu(false);}}>
                  <span style={{fontSize:22}}>{item.icon}</span>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontSize:13,fontWeight:600,color:role===item.id?C.primary:C.text}}>{item.label}</div>
                    {count>0&&<span style={{...badge(badgeColors[item.id]||C.sub),fontSize:10,padding:"2px 6px"}}>{count}</span>}
                  </div>
                </button>;
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<YilnanApp/>);
</script>
